<h1>运维实验环境 <span class="tag">运行中</span></h1>
<p>这台服务器由我独立搭建并持续维护，所有组件均为手工配置。</p>
<ul>
<li><b>云服务器</b>：阿里云 ECS · Ubuntu 22.04 LTS · 2 vCPU / 2 GiB</li>
<li><b>容器化</b>：Docker <code>29.9.3</code> + Docker Compose</li>
<li><b>反向代理</b>：Nginx 作为唯一入口，转发至容器内部端口</li>
<li><b>自动化</b>：Shell 脚本 + crontab 每日备份</li>
</ul>
